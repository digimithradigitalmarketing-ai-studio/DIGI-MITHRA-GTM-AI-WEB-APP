# CI for the GTM app and its database migrations. Runs on pushes and pull requests to any branch.
# It never deploys and never touches Supabase. The SQL suite runs against a throwaway Postgres 17
# service container, and the replay harness drops and recreates only gtm_local_* databases on it.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: lint, type-check, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders for build-time env. The build does not call Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  sql:
    name: SQL migrations and tests (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Replay migrations and run the SQL suites
        working-directory: supabase/tests/local
        run: ./run_local.sh
      - name: Upload SQL logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sql-logs
          path: supabase/tests/local/results/
